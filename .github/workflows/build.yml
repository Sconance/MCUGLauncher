name: Windows build
on:
  push:
    branches: [main, test, "0.22.1", "0.22.2", "0.22.3", "0.22.3-fix", "0.22.3-Avalonia", "0.22.3-codex", "0.24.0-codex"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate repository layout
        run: python scripts/check-layout.py
      - name: Check native UI boundaries
        run: python scripts/check-native-boundaries.py
      - name: Check version metadata
        run: python scripts/check-version.py
      - name: Check source formatting
        run: dotnet run --project tools/SourceFormatter
      - name: Build launcher
        run: ./scripts/build.ps1

      - name: Run isolated regression checks
        run: ./scripts/run-checks.ps1 -Name LauncherChecks,MuaChecks,DownloadChecks,QueueChecks,CompatibilityChecks,WebBridgeChecks

      - name: Native Avalonia interaction and Skia layout checks
        run: ./scripts/run-checks.ps1 -Name NativeUiChecks
      - name: Upload native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-checks
          path: work/native-ui/*.png
